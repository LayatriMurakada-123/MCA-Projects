{% extends "base.html" %}
{% block heading %}Staff{% endblock %}
{% block content %}
<div class="toolbar"><div><p class="intro">Maintain hostel warden, supervisor and security staff details.</p></div><button class="btn" onclick="openModal()">Add</button></div>
<div class="panel table-panel"><div class="table-wrap"><table id="staffTable"><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Shift</th><th>Actions</th></tr></thead><tbody></tbody></table></div></div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2>Add</h2><form id="dataForm">
      <div class="field"><label>Name</label><input name="name" required></div>
      <div class="field"><label>Role</label><input name="role" required></div>
      <div class="field"><label>Phone</label><input name="phone" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Shift</label><select name="shift"><option>Morning</option><option>Evening</option><option>Night</option></select></div><button class="btn" type="submit">Save</button></form></div></div>
{% endblock %}
{% block scripts %}<script>setupPage("staff");</script>{% endblock %}
